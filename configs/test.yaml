# Smoke test: Qwen2.5-0.5B on the tiny splits.
# Qwen2.5-7B-Instruct and Qwen3-1.7B-FP8 were out of reach on this machine
# (FP8 wants compute capability >= 8.9; this GPU is 8.6).
# LoRA and the training schedule are hardcoded in src/finetune.py.
seed: 13

data:
  training: "data/small_train.json"
  testing: "data/micro_test.json"
  max_length: 256

model:
  model_name: "Qwen/Qwen2.5-0.5B" # testing model

prompt:
  template: |
    Classify the following statement with one label only from: pants-fire, false, mostly-false, half-true, mostly-true, true.
    Statement: {statement}
    Answer with only the label, nothing else:

mlflow:
  enable: true
  tracking_uri: "sqlite:///mlflow.db"
  exp_name: "qwen-politi-finetune-v1"
  run_name: null
  artifact_path: "finetuned-model"
